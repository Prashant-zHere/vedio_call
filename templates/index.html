<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Private Call</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body class="page">
    <header class="topbar">
      <div class="topbar__left">
        <div class="pill" id="statusPill" aria-live="polite">Connecting…</div>
        <div class="pill pill--muted" id="peerPill">Peers: 0/2</div>
      </div>
      <div class="topbar__right">
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf" value="{{ csrf }}" />
          <button class="btn btn--ghost" type="submit">Logout</button>
        </form>
      </div>
    </header>

    <main class="stage">
      <section class="videoGrid" aria-label="Video calling area">
        <div class="videoWrap videoWrap--remote">
          <video id="remoteVideo" class="video" autoplay playsinline></video>
          <div class="badge" id="remoteBadge">Remote</div>
          <div class="overlay" id="remoteOverlay" hidden>
            <div class="spinner"></div>
            <div class="overlayText" id="remoteOverlayText">Waiting for the other user…</div>
          </div>
        </div>

        <div class="videoWrap videoWrap--local">
          <video id="localVideo" class="video video--local" autoplay playsinline muted></video>
          <div class="badge">You</div>
        </div>
      </section>

      <section class="controls" aria-label="Call controls">
        <button class="btn btn--control" id="btnMic" type="button" aria-pressed="false">
          Mic On
        </button>
        <button class="btn btn--control" id="btnCam" type="button" aria-pressed="false">
          Cam On
        </button>
        <button class="btn btn--danger" id="btnHangup" type="button">
          End
        </button>
      </section>

      <section class="notice" id="notice" aria-live="polite"></section>
    </main>

    <!--
      SCREENSHOT / RECORDING MITIGATION (IMPORTANT):
      True screenshot/screen-recording prevention is NOT possible on the web.
      Browsers and operating systems ultimately control capture APIs and user actions.
      We only implement deterrence and risk-reduction UX (blur on tab hidden, disable right-click, etc.).
    -->

    <script nonce="{{ nonce }}">
      // Inject minimal server-rendered config into JS without exposing secrets.
      window.__APP_CONFIG__ = Object.freeze({
        roomToken: {{ roomToken|tojson }},
        userId: {{ userId|tojson }},
        turn: {
          urls: {{ turnUrls|tojson }},
          username: {{ turnUsername|tojson }},
          credential: {{ turnCredential|tojson }},
        }
      });
    </script>
    <!-- Socket.IO client served by Flask-SocketIO from same origin (no third-party CDN). -->
    <script src="/socket.io/socket.io.js" nonce="{{ nonce }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}" nonce="{{ nonce }}"></script>
  </body>
</html>
